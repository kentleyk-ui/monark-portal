<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MONARK // ACCESS PORTAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bf00ff;
            --neon-pink: #ff00aa;
            --neon-blue: #0066ff;
            --dark-bg: #05050f;
            --glass: rgba(10, 15, 30, 0.65);
            --glow: 0 0 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--dark-bg);
            font-family: 'Rajdhani', sans-serif;
            color: #e0f7ff;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Animated background */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--neon-cyan);
            border-radius: 50%;
            opacity: 0.6;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Glow orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            animation: pulse 8s ease-in-out infinite;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: var(--neon-purple);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: var(--neon-cyan);
            bottom: -80px;
            right: -80px;
            animation-delay: -3s;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: var(--neon-pink);
            top: 40%;
            right: 10%;
            animation-delay: -5s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.5; }
        }

        /* Main container */
        .portal {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        /* Header */
        .header {
            text-align: center;
            position: relative;
        }

        .logo-ring {
            width: 90px;
            height: 90px;
            border: 2px solid var(--neon-cyan);
            border-radius: 50%;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: var(--glow) var(--neon-cyan), inset 0 0 20px rgba(0, 243, 255, 0.2);
            animation: ringPulse 3s ease-in-out infinite;
        }

        .logo-ring::before {
            content: '';
            position: absolute;
            inset: -8px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 50%;
            animation: spin 12s linear infinite;
        }

        .logo-ring::after {
            content: '';
            position: absolute;
            inset: -16px;
            border: 1px dashed rgba(191, 0, 255, 0.4);
            border-radius: 50%;
            animation: spin 18s linear infinite reverse;
        }

        @keyframes ringPulse {
            0%, 100% { box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 20px rgba(0, 243, 255, 0.2); }
            50% { box-shadow: 0 0 40px var(--neon-cyan), 0 0 60px rgba(0, 243, 255, 0.3), inset 0 0 30px rgba(0, 243, 255, 0.3); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .logo-icon {
            font-size: 36px;
            filter: drop-shadow(0 0 8px var(--neon-cyan));
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 1.7rem;
            letter-spacing: 4px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.95rem;
            letter-spacing: 3px;
            color: rgba(0, 243, 255, 0.7);
            text-transform: uppercase;
            font-weight: 500;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            font-size: 0.8rem;
            color: #00ff9d;
            letter-spacing: 1px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff9d;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff9d;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Menu cards */
        .menu {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            position: relative;
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.25);
            border-radius: 16px;
            padding: 20px 22px;
            display: flex;
            align-items: center;
            gap: 18px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
            cursor: pointer;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent, rgba(0, 243, 255, 0.08), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .card:hover::before,
        .card:active::before {
            transform: translateX(100%);
        }

        .card:hover,
        .card:active {
            border-color: var(--neon-cyan);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(0, 243, 255, 0.25),
                inset 0 0 20px rgba(0, 243, 255, 0.05);
        }

        .card-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            position: relative;
        }

        .card-icon.call {
            background: linear-gradient(135deg, rgba(0, 255, 157, 0.2), rgba(0, 243, 255, 0.15));
            border: 1px solid rgba(0, 255, 157, 0.4);
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.2);
        }

        .card-icon.app {
            background: linear-gradient(135deg, rgba(191, 0, 255, 0.25), rgba(0, 102, 255, 0.2));
            border: 1px solid rgba(191, 0, 255, 0.45);
            box-shadow: 0 0 20px rgba(191, 0, 255, 0.25);
        }

        .card-icon.web {
            background: linear-gradient(135deg, rgba(255, 0, 170, 0.2), rgba(0, 243, 255, 0.15));
            border: 1px solid rgba(255, 0, 170, 0.4);
            box-shadow: 0 0 20px rgba(255, 0, 170, 0.2);
        }

        .card-content {
            flex: 1;
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 1.5px;
            margin-bottom: 3px;
            color: #fff;
        }

        .card-desc {
            font-size: 0.85rem;
            color: rgba(180, 220, 255, 0.7);
            font-weight: 400;
        }

        .card-arrow {
            font-size: 20px;
            color: var(--neon-cyan);
            opacity: 0.6;
            transition: all 0.3s;
        }

        .card:hover .card-arrow {
            opacity: 1;
            transform: translateX(4px);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: rgba(0, 243, 255, 0.4);
            letter-spacing: 2px;
            margin-top: 8px;
        }

        .footer span {
            color: rgba(191, 0, 255, 0.6);
        }

        /* Scanline effect */
        .scanlines {
            position: fixed;
            inset: 0;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 0, 0, 0.05) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.3;
        }

        /* Responsive */
        @media (max-width: 380px) {
            .title { font-size: 1.4rem; letter-spacing: 2px; }
            .card { padding: 16px 18px; }
            .card-icon { width: 46px; height: 46px; font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="particles" id="particles"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="scanlines"></div>

    <div class="portal">
        <div class="header">
            <div class="logo-ring">
                <div class="logo-icon">◈</div>
            </div>
            <h1 class="title">MONARK</h1>
            <p class="subtitle">Access Portal</p>
            <div class="status">
                <div class="status-dot"></div>
                SYSTÈME EN LIGNE
            </div>
        </div>

        <div class="menu">
            <!-- Call -->
            <a href="tel:+15142165549" class="card">
                <div class="card-icon call">📞</div>
                <div class="card-content">
                    <div class="card-title">APPELER</div>
                    <div class="card-desc">+1 (514) 216-5549</div>
                </div>
                <div class="card-arrow">›</div>
            </a>

            <!-- Monark App -->
            <a href="https://monarkapp.milele4ever.com" target="_blank" rel="noopener" class="card">
                <div class="card-icon app">⚡</div>
                <div class="card-content">
                    <div class="card-title">MONARK APP</div>
                    <div class="card-desc">Ouvrir l'application</div>
                </div>
                <div class="card-arrow">›</div>
            </a>

            <!-- Website -->
            <a href="https://www.milele4ever.com" target="_blank" rel="noopener" class="card">
                <div class="card-icon web">🌐</div>
                <div class="card-content">
                    <div class="card-title">MILELE4EVER</div>
                    <div class="card-desc">Visiter le site officiel</div>
                </div>
                <div class="card-arrow">›</div>
            </a>
        </div>

        <div class="footer">
            MILELE4EVER <span>//</span> FUTURE ACCESS
        </div>
    </div>

    <script>
        // Create floating particles
        const container = document.getElementById('particles');
        for (let i = 0; i < 35; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (8 + Math.random() * 15) + 's';
            p.style.animationDelay = (Math.random() * 10) + 's';
            p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
            if (Math.random() > 0.7) {
                p.style.background = Math.random() > 0.5 ? '#bf00ff' : '#ff00aa';
            }
            container.appendChild(p);
        }

        // Subtle haptic-like feedback on touch (visual only)
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('touchstart', () => {
                card.style.transform = 'scale(0.97)';
            });
            card.addEventListener('touchend', () => {
                card.style.transform = '';
            });
        });
    </script>
</body>
</html>
